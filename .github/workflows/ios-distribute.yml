name: iOS Distribution

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution target
        required: true
        type: choice
        options:
          - internal
          - release
      source_sha:
        description: Exact 40-character commit SHA to archive
        required: true
        type: string
      marketing_version:
        description: Expected MARKETING_VERSION from ios/project.yml
        required: true
        type: string
      build_number:
        description: Next App Store Connect build number under the selected marketing version
        required: true
        type: string

concurrency:
  group: ios-distribution
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    name: Archive & Upload iOS
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-distribution
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and distribution inputs
        id: release
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            internal)
              expected_branch="preview"
              scheme="PulpeProd"
              configuration="Prod"
              ;;
            release)
              expected_branch="main"
              scheme="PulpeProd"
              configuration="Prod"
              ;;
            *)
              echo "::error::Unsupported distribution channel: $CHANNEL"
              exit 1
              ;;
          esac

          tagged_release_recovery=false
          if [ "$GITHUB_REF_NAME" != "$expected_branch" ]; then
            if [ "$CHANNEL" = release ] && [ "$GITHUB_REF_NAME" = preview ]; then
              tagged_release_recovery=true
            else
              echo "::error::Channel '$CHANNEL' must be dispatched from '$expected_branch', not '$GITHUB_REF_NAME'"
              exit 1
            fi
          fi
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be a full lowercase 40-character SHA"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_MARKETING_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::marketing_version must use X.Y.Z"
            exit 1
          fi
          if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[1-9][0-9]{0,17}$'; then
            echo "::error::build_number must be a positive integer of at most 18 digits"
            exit 1
          fi
          if ! printf '%s' "$ASC_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::ASC_KEY_ID is missing or invalid"
            exit 1
          fi
          if ! printf '%s' "$ASC_ISSUER_ID" | grep -Eq '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'; then
            echo "::error::ASC_ISSUER_ID is missing or invalid"
            exit 1
          fi
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID is missing or invalid"
            exit 1
          fi

          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Checked out $checked_out_sha instead of approved $SOURCE_SHA"
            exit 1
          fi
          git fetch --force --tags origin "refs/heads/$expected_branch:refs/remotes/origin/$expected_branch"
          if [ "$tagged_release_recovery" = true ]; then
            release_version=$(node -p "require('../package.json').version")
            if ! printf '%s' "$release_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tagged release recovery requires a semantic root package version"
              exit 1
            fi
            recovery_tag="refs/tags/v$release_version"
            echo "Require exact annotated release tag for recovery: $recovery_tag"
            if [ "$(git cat-file -t "$recovery_tag" 2>/dev/null || true)" != tag ] ||
               [ "$(git rev-parse "$recovery_tag^{commit}" 2>/dev/null || true)" != "$SOURCE_SHA" ]; then
              echo "::error::Release recovery from preview requires $recovery_tag to be an annotated tag for $SOURCE_SHA"
              exit 1
            fi
          fi
          reachable=false
          if git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$expected_branch"; then
            reachable=true
          elif [ "$CHANNEL" = release ]; then
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                && [ "$(git cat-file -t "$tag")" = tag ] \
                && [ "$(git rev-parse "$tag^{commit}")" = "$SOURCE_SHA" ]; then
                reachable=true
              fi
            done < <(git for-each-ref --format='%(refname)' refs/tags)
          fi
          if [ "$reachable" != true ]; then
            echo "::error::$SOURCE_SHA is not an authorized $CHANNEL source"
            exit 1
          fi

          actual_marketing_version=$(python3 -c 'import re; text=open("project.yml", encoding="utf-8").read(); match=re.search(r"^\s+MARKETING_VERSION:\s*\"?([^\"\s]+)", text, re.M); print(match.group(1) if match else "")')
          project_build=$(python3 -c 'import re; text=open("project.yml", encoding="utf-8").read(); match=re.search(r"^\s+CURRENT_PROJECT_VERSION:\s*\"?([^\"\s]+)", text, re.M); print(match.group(1) if match else "")')
          if [ "$actual_marketing_version" != "$EXPECTED_MARKETING_VERSION" ]; then
            echo "::error::Marketing version mismatch: expected $EXPECTED_MARKETING_VERSION, source has $actual_marketing_version"
            exit 1
          fi
          if ! printf '%s' "$project_build" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::CURRENT_PROJECT_VERSION is not a positive integer: $project_build"
            exit 1
          fi
          if [ "$CHANNEL" = "release" ] && [ "$project_build" != "$BUILD_NUMBER" ]; then
            echo "::error::Release build $BUILD_NUMBER is not recorded in project.yml (found $project_build)"
            exit 1
          fi
          if [ "$CHANNEL" != "release" ] && [ "$BUILD_NUMBER" -lt "$project_build" ]; then
            echo "::error::Internal build $BUILD_NUMBER must be at least project.yml build $project_build"
            exit 1
          fi

          echo "branch=$expected_branch" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "configuration=$configuration" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$actual_marketing_version" >> "$GITHUB_OUTPUT"

      - name: Require immutable deployment proof for source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            internal)
              node ../.github/scripts/resolve-workflow-proof.mjs \
                --workflow staging-proof.yml \
                --event deployment_status \
                --branch "$EXPECTED_BRANCH" \
                --sha "$SOURCE_SHA" \
                --job "✅ Staging Ready (shadow)" \
                --artifact-template "staging-proof-{sha}-run-{run_id}-attempt-{attempt}" \
                >/dev/null
              ;;
            release)
              node ../.github/scripts/resolve-workflow-proof.mjs \
                --workflow production-finalize.yml \
                --event deployment_status \
                --branch "$EXPECTED_BRANCH" \
                --sha "$SOURCE_SHA" \
                --job "✅ Publish proven production" \
                --artifact-template "production-proof-{sha}-run-{run_id}-attempt-{attempt}" \
                >/dev/null
              ;;
          esac

      - name: Prepare App Store status credential
        env:
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_PRIVATE_KEY_P8_BASE64:?Missing ASC_PRIVATE_KEY_P8_BASE64}"
          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_P8_BASE64" | base64 -D > "$asc_key_path"
          chmod 600 "$asc_key_path"
          openssl pkey -in "$asc_key_path" -check -noout
          echo "ASC_KEY_PATH=$asc_key_path" >> "$GITHUB_ENV"
      - name: Query exact App Store build
        id: asc
        run: |
          set -euo pipefail
          state=$(ruby ../.github/scripts/app-store-build-status.rb app.pulpe.ios "$EXPECTED_MARKETING_VERSION" "$BUILD_NUMBER")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "ASC_INITIAL_STATE=$state" >> "$GITHUB_ENV"
          if [ "$state" = invalid ]; then
            echo "::error::App Store Connect reports this exact build as invalid"
            exit 1
          fi
      - name: Verify marketing version accepts new builds
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          state=$(ruby ../.github/scripts/app-store-build-status.rb --marketing-version-status app.pulpe.ios "$EXPECTED_MARKETING_VERSION")
          case "$state" in
            open) ;;
            closed)
              echo "::error::Marketing version $EXPECTED_MARKETING_VERSION is already distributed and its pre-release train is closed"
              exit 1
              ;;
            *)
              echo "::error::App Store Connect returned an invalid marketing-version state"
              exit 1
              ;;
          esac
      - name: Verify next build number for marketing version
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          expected_build=$(ruby ../.github/scripts/app-store-build-status.rb --next-build-number app.pulpe.ios "$EXPECTED_MARKETING_VERSION")
          if [ "$expected_build" = invalid ]; then
            echo "::error::App Store Connect returned invalid build data for marketing version $EXPECTED_MARKETING_VERSION"
            exit 1
          fi
          if [ "$BUILD_NUMBER" != "$expected_build" ]; then
            echo "::error::Build $BUILD_NUMBER is not next for marketing version $EXPECTED_MARKETING_VERSION (expected $expected_build)"
            exit 1
          fi
      - name: Verify existing App Store build provenance
        if: steps.asc.outputs.state != 'not_found'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ../.github/scripts/resolve-ios-distribution-intent.mjs \
            --sha "$SOURCE_SHA" \
            --marketing-version "$EXPECTED_MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --channel "$CHANNEL" \
            --automation-branch "$GITHUB_REF_NAME" \
            >/dev/null
      - name: Poll App Store build processing
        if: steps.asc.outputs.state == 'processing'
        run: |
          for _ in {1..30}; do
            sleep 60
            state=$(ruby ../.github/scripts/app-store-build-status.rb app.pulpe.ios "$EXPECTED_MARKETING_VERSION" "$BUILD_NUMBER")
            [ "$state" = valid ] && exit 0
            [ "$state" = processing ] || { echo "::error::App Store build became $state"; exit 1; }
          done
          echo "::error::App Store build processing timed out"
          exit 1
      - name: Setup Xcode
        if: steps.asc.outputs.state == 'not_found'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.2"

      - name: Install XcodeGen
        if: steps.asc.outputs.state == 'not_found'
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Cache SPM packages
        if: steps.asc.outputs.state == 'not_found'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ios-distribution-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ios-distribution-spm-

      - name: Import signing credentials
        if: steps.asc.outputs.state == 'not_found'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:?Missing IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}"

          keychain_path="$RUNNER_TEMP/ios-distribution.keychain-db"
          certificate_path="$RUNNER_TEMP/distribution-certificate.p12"
          keychain_password=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"

          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"(.*)"$/\1/' \
            > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          set --
          while IFS= read -r keychain; do
            set -- "$@" "$keychain"
          done < "$RUNNER_TEMP/original-keychains.txt"
          security list-keychains -d user -s "$keychain_path" "$@"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" \
            | grep -q 'Apple Distribution'; then
            echo "::error::The PKCS#12 does not contain a usable Apple Distribution identity and private key"
            exit 1
          fi

          chmod 600 "$certificate_path"

      - name: Install App Store provisioning profiles
        if: steps.asc.outputs.state == 'not_found'
        env:
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${IOS_APP_PROVISIONING_PROFILE_BASE64:?Missing IOS_APP_PROVISIONING_PROFILE_BASE64}"
          : "${IOS_WIDGET_PROVISIONING_PROFILE_BASE64:?Missing IOS_WIDGET_PROVISIONING_PROFILE_BASE64}"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          app_profile="$RUNNER_TEMP/pulpe-app-store.mobileprovision"
          widget_profile="$RUNNER_TEMP/pulpe-widget-app-store.mobileprovision"
          app_plist="$RUNNER_TEMP/pulpe-app-store.plist"
          widget_plist="$RUNNER_TEMP/pulpe-widget-app-store.plist"
          mkdir -p "$profiles_dir"
          chmod 700 "$profiles_dir"

          printf '%s' "$IOS_APP_PROVISIONING_PROFILE_BASE64" | base64 -D > "$app_profile"
          printf '%s' "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 -D > "$widget_profile"

          install_profile() {
            source_profile="$1"
            decoded_plist="$2"
            expected_name="$3"
            expected_identifier="$4"
            output_name="$5"

            security cms -D -i "$source_profile" > "$decoded_plist"
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$decoded_plist")
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_plist")
            app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded_plist")
            if [ "$profile_name" != "$expected_name" ]; then
              echo "::error::Unexpected provisioning profile name: $profile_name"
              exit 1
            fi
            if [ "$app_identifier" != "$expected_identifier" ]; then
              echo "::error::Unexpected provisioning profile application identifier: $app_identifier"
              exit 1
            fi

            installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
            echo "$output_name=$installed_profile" >> "$GITHUB_ENV"
            cp "$source_profile" "$installed_profile"
            chmod 600 "$installed_profile"
          }

          install_profile \
            "$app_profile" \
            "$app_plist" \
            "Pulpe App Store CI" \
            "$APPLE_TEAM_ID.app.pulpe.ios" \
            APP_INSTALLED_PROFILE
          install_profile \
            "$widget_profile" \
            "$widget_plist" \
            "Pulpe Widget App Store CI" \
            "$APPLE_TEAM_ID.app.pulpe.ios.widget" \
            WIDGET_INSTALLED_PROFILE

      - name: Configure manual App Store signing
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text(encoding="utf-8")
          profiles = {
              '        INFOPLIST_KEY_CFBundleDisplayName: Pulpe':
                  '$(PULPE_APP_PROVISIONING_PROFILE_SPECIFIER)',
              '        INFOPLIST_KEY_CFBundleDisplayName: "Pulpe Widget"':
                  '$(PULPE_WIDGET_PROVISIONING_PROFILE_SPECIFIER)',
          }
          for marker, profile_variable in profiles.items():
              setting = f'          PROVISIONING_PROFILE_SPECIFIER: "{profile_variable}"'
              if setting in text:
                  continue
              if text.count(marker) != 1:
                  raise SystemExit(f"expected one signing marker, found {text.count(marker)}: {marker}")
              replacement = (
                  f"{marker}\n"
                  "      configs:\n"
                  "        Prod:\n"
                  f"{setting}"
              )
              text = text.replace(marker, replacement)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate Xcode project
        if: steps.asc.outputs.state == 'not_found'
        run: xcodegen generate --use-cache

      - name: Archive signed application
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Pulpe.xcarchive"
          xcodebuild archive \
            -project Pulpe.xcodeproj \
            -scheme "${{ steps.release.outputs.scheme }}" \
            -configuration "${{ steps.release.outputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PULPE_APP_PROVISIONING_PROFILE_SPECIFIER="Pulpe App Store CI" \
            PULPE_WIDGET_PROVISIONING_PROFILE_SPECIFIER="Pulpe Widget App Store CI" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ONLY_ACTIVE_ARCH=NO
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Export signed IPA
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/export"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.pulpe.ios</key>
              <string>Pulpe App Store CI</string>
              <key>app.pulpe.ios.widget</key>
              <string>Pulpe Widget App Store CI</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_path=$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$ipa_path" ]; then
            echo "::error::No IPA was exported"
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify exported application identity
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          app_plist=$(unzip -Z1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1)
          if [ -z "$app_plist" ]; then
            echo "::error::Main application Info.plist is missing from the IPA"
            exit 1
          fi
          unzip -p "$IPA_PATH" "$app_plist" > "$RUNNER_TEMP/App-Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/App-Info.plist")
          marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/App-Info.plist")
          exported_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/App-Info.plist")

          if [ "$bundle_id" != "app.pulpe.ios" ]; then
            echo "::error::Unexpected bundle identifier: $bundle_id"
            exit 1
          fi
          if [ "$marketing_version" != "$EXPECTED_MARKETING_VERSION" ]; then
            echo "::error::Exported marketing version is $marketing_version, expected $EXPECTED_MARKETING_VERSION"
            exit 1
          fi
          if [ "$exported_build" != "$BUILD_NUMBER" ]; then
            echo "::error::Exported build is $exported_build, expected $BUILD_NUMBER"
            exit 1
          fi

      - name: Create iOS distribution intent
        if: steps.asc.outputs.state == 'not_found'
        run: |
          python3 -c 'import json,os; json.dump({"repository":os.environ["GITHUB_REPOSITORY"],"source_sha":os.environ["SOURCE_SHA"],"marketing_version":os.environ["EXPECTED_MARKETING_VERSION"],"build_number":os.environ["BUILD_NUMBER"],"channel":os.environ["CHANNEL"],"state":"uploading","run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])},open(os.environ["RUNNER_TEMP"]+"/ios-distribution-intent.json","w"))'
      - name: Upload iOS distribution intent
        if: steps.asc.outputs.state == 'not_found'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-distribution-intent-${{ inputs.marketing_version }}-${{ inputs.build_number }}-${{ inputs.source_sha }}-${{ inputs.channel }}
          path: ${{ runner.temp }}/ios-distribution-intent.json
          retention-days: 30

      - name: Upload to App Store Connect
        if: steps.asc.outputs.state == 'not_found'
        run: |
          set -euo pipefail
          upload_options="$RUNNER_TEMP/UploadOptions.plist"
          upload_path="$RUNNER_TEMP/upload"
          cat > "$upload_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.pulpe.ios</key>
              <string>Pulpe App Store CI</string>
              <key>app.pulpe.ios.widget</key>
              <string>Pulpe Widget App Store CI</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$upload_path" \
            -exportOptionsPlist "$upload_options" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Poll uploaded App Store build
        if: steps.asc.outputs.state == 'not_found'
        run: |
          for _ in {1..30}; do
            sleep 60
            state=$(ruby ../.github/scripts/app-store-build-status.rb app.pulpe.ios "$EXPECTED_MARKETING_VERSION" "$BUILD_NUMBER")
            [ "$state" = valid ] && exit 0
            [ "$state" = processing ] || [ "$state" = not_found ] || { echo "::error::Uploaded App Store build is $state"; exit 1; }
          done
          echo "::error::Uploaded App Store build processing timed out"
          exit 1
      - name: Create iOS distribution proof
        run: |
          python3 -c 'import json,os; json.dump({"repository":os.environ["GITHUB_REPOSITORY"],"source_sha":os.environ["SOURCE_SHA"],"marketing_version":os.environ["EXPECTED_MARKETING_VERSION"],"build_number":os.environ["BUILD_NUMBER"],"channel":os.environ["CHANNEL"],"state":"valid","uploaded":os.environ["ASC_INITIAL_STATE"]=="not_found","run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])},open(os.environ["RUNNER_TEMP"]+"/ios-distribution-proof.json","w"))'
      - name: Upload iOS distribution proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-distribution-proof-${{ inputs.marketing_version }}-${{ inputs.build_number }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/ios-distribution-proof.json
          retention-days: 30
      - name: Distribution summary
        env:
          DISTRIBUTION_BRANCH: ${{ steps.release.outputs.branch }}
          DISTRIBUTION_MARKETING_VERSION: ${{ steps.release.outputs.marketing_version }}
          DISTRIBUTION_SCHEME: ${{ steps.release.outputs.scheme }}
        run: |
          {
            echo "### iOS distribution valid"
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Branch: \`$DISTRIBUTION_BRANCH\`"
            echo "- Marketing version: \`$DISTRIBUTION_MARKETING_VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- Scheme: \`$DISTRIBUTION_SCHEME\`"
            echo ""
            echo "App Store Connect processing is verified here; TestFlight/App Store availability is read back separately by Alfred."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing credentials
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          keychain_path="${KEYCHAIN_PATH:-$RUNNER_TEMP/ios-distribution.keychain-db}"
          certificate_path="${CERTIFICATE_PATH:-$RUNNER_TEMP/distribution-certificate.p12}"
          asc_key_path="${ASC_KEY_PATH:-$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8}"
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            set --
            while IFS= read -r keychain; do
              set -- "$@" "$keychain"
            done < "$RUNNER_TEMP/original-keychains.txt"
            if [ "$#" -gt 0 ]; then
              security list-keychains -d user -s "$@"
            fi
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f \
            "$certificate_path" \
            "$asc_key_path" \
            "${APP_INSTALLED_PROFILE:-}" \
            "${WIDGET_INSTALLED_PROFILE:-}" \
            "$RUNNER_TEMP/App-Info.plist" \
            "$RUNNER_TEMP/pulpe-app-store.mobileprovision" \
            "$RUNNER_TEMP/pulpe-widget-app-store.mobileprovision" \
            "$RUNNER_TEMP/pulpe-app-store.plist" \
            "$RUNNER_TEMP/pulpe-widget-app-store.plist" \
            "$RUNNER_TEMP/ci-workflow-runs.json" \
            "$RUNNER_TEMP/ci-workflow-jobs.json" \
            "$RUNNER_TEMP/original-keychains.txt" \
            "$RUNNER_TEMP/ios-distribution-intent.json" \
            "$RUNNER_TEMP/ios-distribution-proof.json"
          rm -rf \
            "$RUNNER_TEMP/Pulpe.xcarchive" \
            "$RUNNER_TEMP/export" \
            "$RUNNER_TEMP/upload" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/UploadOptions.plist"
