name: ✅ Production Finalized

on:
  deployment_status:

concurrency:
  group: production-finalize-${{ github.event.deployment.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  verify:
    name: 🔎 Verify exact production
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.creator.login == 'railway-app[bot]' && github.event.deployment.environment == 'pulpe-backend / production' && github.event.deployment.creator.login == 'railway-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id }}
      DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
    outputs:
      context: ${{ steps.context.outputs.context }}
      frontend_deployment_id: ${{ steps.providers.outputs.frontend_deployment_id }}
      landing_deployment_id: ${{ steps.providers.outputs.landing_deployment_id }}
    steps:
      - name: Checkout exact production automation without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify event and exact authorized preflight
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.deployment.ref }}" = "$PRODUCTION_SHA"
          [[ "$PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" > "$RUNNER_TEMP/deployment.json"
          jq -e --arg sha "$PRODUCTION_SHA" --argjson id "$DEPLOYMENT_ID" '.id == $id and .sha == $sha and .ref == $sha and .environment == "pulpe-backend / production" and .creator.login == "railway-app[bot]"' "$RUNNER_TEMP/deployment.json"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" > "$RUNNER_TEMP/statuses.json"
          railway_url='https://railway.com/project/33ba829c-d4d6-4096-b0dc-57c89c367063?environmentId=a28b6826-ecbe-4c0f-9856-e0ba3ce14e93'
          jq -e --argjson id "$DEPLOYMENT_STATUS_ID" --arg url "$railway_url" '[.[] | select(.id == $id and .state == "success" and .creator.login == "railway-app[bot]" and .environment_url == $url and .log_url == $url and .target_url == $url)] | length == 1' "$RUNNER_TEMP/statuses.json"

          proof=$(node .github/scripts/resolve-workflow-proof.mjs \
            --workflow production.yml \
            --event push \
            --branch main \
            --sha "$PRODUCTION_SHA" \
            --job "🚦 Record production authorization" \
            --artifact-template "production-context-{sha}-run-{run_id}-attempt-{attempt}")
          context_run_id=$(jq -r .run_id <<< "$proof")
          context_attempt=$(jq -r .attempt <<< "$proof")
          artifact=$(jq -r .artifact_name <<< "$proof")
          gh run download "$context_run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/context"
          context="$RUNNER_TEMP/context/production-context.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$PRODUCTION_SHA" --argjson run "$context_run_id" --argjson attempt "$context_attempt" '.repository == $repo and .production_sha == $sha and .workflow_run_id == $run and .run_attempt == $attempt and (.candidate_sha | test("^[0-9a-f]{40}$")) and (.tree_sha | test("^[0-9a-f]{40}$")) and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$context"

          echo "context=$(jq -c . "$context")" >> "$GITHUB_OUTPUT"

      - name: Verify exact Vercel deployments and public services
        id: providers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(steps.context.outputs.context).version }}
        run: |
          set -euo pipefail
          deployment() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" -f environment="$1" -f sha="$PRODUCTION_SHA" -f per_page=100 | jq -r --arg sha "$PRODUCTION_SHA" '[.[] | select(.sha == $sha and .ref == $sha and .creator.login == "vercel[bot]")] | max_by(.id) | .id // empty'
          }
          state() { gh api "repos/$GITHUB_REPOSITORY/deployments/$1/statuses" --jq '[.[] | select(.creator.login == "vercel[bot]")] | max_by(.id) | select((.environment_url // "" | startswith("https://")) and .log_url == .environment_url and .target_url == .environment_url) | .state // empty'; }
          for _ in {1..60}; do
            frontend_id=$(deployment "Production – pulpe-frontend")
            landing_id=$(deployment "Production – pulpe-landing")
            frontend_state=${frontend_id:+$(state "$frontend_id")}
            landing_state=${landing_id:+$(state "$landing_id")}
            case "$frontend_state $landing_state" in *error*|*failure*) exit 1 ;; esac
            if [ "$frontend_state $landing_state" = "success success" ]; then break; fi
            sleep 10
          done
          test "$frontend_state $landing_state" = "success success"
          curl --fail --silent --show-error --location --max-time 20 https://app.pulpe.app/ >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://pulpe.app/ >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/health > "$RUNNER_TEMP/health.json"
          jq -e '.status == "healthy"' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/api/v1/app/version > "$RUNNER_TEMP/version.json"
          jq -e --arg version "$VERSION" '.success == true and .data.web.latestVersion == $version' "$RUNNER_TEMP/version.json"
          echo "frontend_deployment_id=$frontend_id" >> "$GITHUB_OUTPUT"
          echo "landing_deployment_id=$landing_id" >> "$GITHUB_OUTPUT"

  publish:
    name: ✅ Publish proven production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONTEXT: ${{ needs.verify.outputs.context }}
      PRODUCTION_SHA: ${{ fromJSON(needs.verify.outputs.context).production_sha }}
      VERSION: ${{ fromJSON(needs.verify.outputs.context).version }}
      RAILWAY_CLI_VERSION: "5.15.0"
      RAILWAY_CLI_SHA256: d302113b772b8f34d28ed2242c1d258953de989c282d4cc72291239ccb0fb041
      RAILWAY_PROJECT: 33ba829c-d4d6-4096-b0dc-57c89c367063
      RAILWAY_SERVICE: b1f9b1c0-7eca-4c58-b203-cdbbed8ae0a4
    steps:
      - name: Install verified Railway CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway.tar.gz"
          bin_dir="$RUNNER_TEMP/railway-cli"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 60 --location "https://github.com/railwayapp/cli/releases/download/v$RAILWAY_CLI_VERSION/railway-v$RAILWAY_CLI_VERSION-x86_64-unknown-linux-gnu.tar.gz" --output "$archive"
          echo "$RAILWAY_CLI_SHA256  $archive" | sha256sum --check
          mkdir -p "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir"
          test -x "$bin_dir/railway"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify active Railway production deployment
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          railway deployment list --project "$RAILWAY_PROJECT" --environment production --service "$RAILWAY_SERVICE" --limit 50 --json > "$RUNNER_TEMP/railway.json"
          jq -e --arg sha "$PRODUCTION_SHA" '.[0].status == "SUCCESS" and .[0].meta.commitHash == $sha and .[0].meta.branch == "main"' "$RUNNER_TEMP/railway.json"
          echo "deployment_id=$(jq -r '.[0].id' "$RUNNER_TEMP/railway.json")" >> "$GITHUB_OUTPUT"

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PULPE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PULPE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pulpe

      - name: Publish exact tag and GitHub Release idempotently
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          preparation_pr=$(jq -r .preparation_pr <<< "$CONTEXT")
          gh api "repos/$GITHUB_REPOSITORY/pulls/$preparation_pr" --jq .body | sed -n "/^## v$VERSION$/,$ p" > "$notes"
          test "$(sed -n '1p' "$notes")" = "## v$VERSION"
          encoded_tag=$(jq -rn --arg value "v$VERSION" '$value | @uri')

          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$encoded_tag" > "$RUNNER_TEMP/tags.json"
          tag_count=$(jq --arg ref "refs/tags/v$VERSION" '[.[] | select(.ref == $ref)] | length' "$RUNNER_TEMP/tags.json")
          if [ "$tag_count" = 0 ]; then
            tag_object=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="v$VERSION" -f object="$PRODUCTION_SHA" -f type=commit --jq .sha)
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_object" >/dev/null
          else
            test "$tag_count" = 1
            tag_object=$(jq -r --arg ref "refs/tags/v$VERSION" '.[] | select(.ref == $ref) | .object.sha' "$RUNNER_TEMP/tags.json")
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag.json"
            jq -e --arg tag "v$VERSION" --arg sha "$PRODUCTION_SHA" '.tag == $tag and .object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/tag.json"
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > "$RUNNER_TEMP/releases.jsonl"
          release_count=$(jq -s --arg tag "v$VERSION" '[.[] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.jsonl")
          body=$(cat "$notes")
          if [ "$release_count" = 0 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$VERSION" -f target_commitish="$PRODUCTION_SHA" -f name="v$VERSION" -F draft=false -F prerelease=false -F generate_release_notes=false --raw-field body="$body" --jq .html_url
          else
            jq -se --arg tag "v$VERSION" --arg target "$PRODUCTION_SHA" --arg body "$body" '[.[] | select(.tag_name == $tag)] | length == 1 and .[0].target_commitish == $target and .[0].name == $tag and .[0].body == $body and .[0].draft == false and .[0].prerelease == false' "$RUNNER_TEMP/releases.jsonl"
          fi

      - name: Record immutable production proof
        run: |
          jq -n --argjson context "$CONTEXT" --arg railway "${{ steps.railway.outputs.deployment_id }}" --argjson workflow_run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson frontend "${{ needs.verify.outputs.frontend_deployment_id }}" --argjson landing "${{ needs.verify.outputs.landing_deployment_id }}" '$context + {preflight:{run_id:$context.workflow_run_id,attempt:$context.run_attempt},workflow_run_id:$workflow_run_id,run_attempt:$run_attempt,deployments:{frontend:$frontend,landing:$landing,railway:$railway}}' > production-proof.json

      - name: Upload production proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-proof-${{ fromJSON(needs.verify.outputs.context).production_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: production-proof.json
          retention-days: 90
          if-no-files-found: error
