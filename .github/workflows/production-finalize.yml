name: ✅ Production Finalized
on:
  deployment_status:
concurrency:
  group: production-finalize-${{ github.event.deployment.sha }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read
jobs:
  finalize:
    name: ✅ Finalize proven production
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.creator.login == 'railway-app[bot]' && github.event.deployment.environment == 'pulpe-backend / production' && github.event.deployment.creator.login == 'railway-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      PRODUCTION_SHA: ${{ github.event.deployment.sha }}
      DEPLOYMENT_ID: ${{ github.event.deployment.id }}
      DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
      RAILWAY_CLI_VERSION: "5.15.0"
      RAILWAY_CLI_SHA256: d302113b772b8f34d28ed2242c1d258953de989c282d4cc72291239ccb0fb041
      RAILWAY_PROJECT: 33ba829c-d4d6-4096-b0dc-57c89c367063
      RAILWAY_SERVICE: b1f9b1c0-7eca-4c58-b203-cdbbed8ae0a4
    steps:
      - name: Verify event and load authorized production context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.event.deployment.creator.login }}" = "railway-app[bot]"
          test "${{ github.event.deployment_status.creator.login }}" = "railway-app[bot]"
          test "${{ github.event.deployment.environment }}" = "pulpe-backend / production"
          test "${{ github.event.deployment.ref }}" = main
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" > "$RUNNER_TEMP/deployment-statuses.json"
          jq -e --argjson id "$DEPLOYMENT_STATUS_ID" '[.[] | select(.id == $id and .state == "success" and .creator.login == "railway-app[bot]")] | length == 1' "$RUNNER_TEMP/deployment-statuses.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$PRODUCTION_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/production.yml/runs" -f event=push -f branch=main -f head_sha="$PRODUCTION_SHA" -f per_page=100 > "$RUNNER_TEMP/runs.json"
          candidates="$RUNNER_TEMP/predeploy-attempts.jsonl"
          : > "$candidates"
          while read -r candidate_run attempt_count; do
            for candidate_attempt in $(seq 1 "$attempt_count"); do
              attempt_file="$RUNNER_TEMP/predeploy-$candidate_run-attempt-$candidate_attempt.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/attempts/$candidate_attempt" > "$attempt_file"
              if jq -e --arg sha "$PRODUCTION_SHA" --argjson attempt "$candidate_attempt" '.path == ".github/workflows/production.yml" and .event == "push" and .head_sha == $sha and .run_attempt == $attempt and .status == "completed" and .conclusion == "success"' "$attempt_file" >/dev/null; then
                jq -cn --argjson run "$candidate_run" --argjson attempt "$candidate_attempt" '{run:$run,attempt:$attempt}' >> "$candidates"
              fi
            done
          done < <(jq -r --arg sha "$PRODUCTION_SHA" '.workflow_runs[] | select(.path == ".github/workflows/production.yml" and .head_sha == $sha) | [.id,.run_attempt] | @tsv' "$RUNNER_TEMP/runs.json")
          selected=$(jq -sc 'sort_by([.run,.attempt]) | last // empty' "$candidates")
          run_id=$(jq -r .run <<< "$selected")
          run_attempt=$(jq -r .attempt <<< "$selected")
          test -n "$run_id"
          artifact="production-context-$PRODUCTION_SHA-run-$run_id-attempt-$run_attempt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" | jq --arg name "$artifact" '[.artifacts[] | select(.name == $name and .expired == false)] | length')" = 1
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/context"
          file="$RUNNER_TEMP/context/production-context.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$PRODUCTION_SHA" --argjson run "$run_id" --argjson attempt "$run_attempt" '.repository == $repo and .production_sha == $sha and .workflow_run_id == $run and .run_attempt == $attempt' "$file"
          jq -r 'to_entries[] | select(.key != "release_gate") | "\(.key | ascii_upcase)=\(.value)"' "$file" >> "$GITHUB_ENV"
          echo "GATE_RUN_ID=$(jq -r .release_gate.run_id "$file")" >> "$GITHUB_ENV"
          echo "GATE_ATTEMPT=$(jq -r .release_gate.attempt "$file")" >> "$GITHUB_ENV"
          echo "GATE_JOB_ID=$(jq -r .release_gate.job_id "$file")" >> "$GITHUB_ENV"
      # Railway has already completed before this event-driven finalizer starts.
      - name: Wait for exact Vercel production deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" -f environment="$1" -f sha="$PRODUCTION_SHA" -f per_page=100 | jq -r --arg creator "$2" '[.[] | select(.creator.login == $creator)] | max_by(.id) | .id // empty'
          }
          state() { gh api "repos/$GITHUB_REPOSITORY/deployments/$1/statuses" --jq 'max_by(.id) | .state // empty'; }

          for _ in {1..120}; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$PRODUCTION_SHA"
            frontend_id=$(deployment "Production – pulpe-frontend" "vercel[bot]")
            landing_id=$(deployment "Production – pulpe-landing" "vercel[bot]")
            frontend_state=${frontend_id:+$(state "$frontend_id")}
            landing_state=${landing_id:+$(state "$landing_id")}
            case "$frontend_state $landing_state" in *error*|*failure*) exit 1 ;; esac
            if [ "$frontend_state" = success ] && [ "$landing_state" = success ]; then break; fi
            sleep 10
          done
          test "$frontend_state $landing_state" = "success success"
          curl --fail --silent --show-error --location --max-time 20 https://app.pulpe.app/ >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://pulpe.app/ >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$PRODUCTION_SHA"
          {
            echo "FRONTEND_DEPLOYMENT_ID=$frontend_id"
            echo "LANDING_DEPLOYMENT_ID=$landing_id"
          } >> "$GITHUB_ENV"

      - name: 📥 Checkout proven production tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PRODUCTION_SHA }}

      - name: 🔒 Verify production CSP headers
        run: |
          set -euo pipefail
          expected=$(python3 -c "
          import json, re
          v = json.load(open('vercel.json'))
          for block in v['headers']:
              for cond in block.get('has', []):
                  if cond.get('type') == 'host' and re.match('^(?:' + cond['value'] + ')$', 'app.pulpe.app'):
                      for header in block['headers']:
                          if header['key'] == 'Content-Security-Policy':
                              print(header['value'])
                              raise SystemExit
          ")
          test -n "$expected"
          for host in app.pulpe.app pulpe-frontend.vercel.app; do
            for attempt in {1..10}; do
              served=$(curl -s --max-time 10 -o /dev/null -D - "https://${host}/" | grep -i '^content-security-policy:' | sed 's/^[^:]*: *//' | tr -d '\r')
              if [ "$served" = "$expected" ]; then break; fi
              if [ "$attempt" = 10 ]; then exit 1; fi
              sleep 30
            done
          done

      - name: Install verified Railway CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway.tar.gz"
          bin_dir="$RUNNER_TEMP/railway-cli"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 60 --location "https://github.com/railwayapp/cli/releases/download/v$RAILWAY_CLI_VERSION/railway-v$RAILWAY_CLI_VERSION-x86_64-unknown-linux-gnu.tar.gz" --output "$archive"
          echo "$RAILWAY_CLI_SHA256  $archive" | sha256sum --check
          mkdir -p "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir"
          test -x "$bin_dir/railway"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify active Railway production deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          railway deployment list --project "$RAILWAY_PROJECT" --environment production --service "$RAILWAY_SERVICE" --limit 50 --json > "$RUNNER_TEMP/railway.json"
          jq -e --arg sha "$PRODUCTION_SHA" '.[0].status == "SUCCESS" and .[0].meta.commitHash == $sha and .[0].meta.branch == "main"' "$RUNNER_TEMP/railway.json"
          echo "ACTIVE_RAILWAY_DEPLOYMENT_ID=$(jq -r '.[0].id' "$RUNNER_TEMP/railway.json")" >> "$GITHUB_ENV"
          echo "RAILWAY_DEPLOYMENT_ID=${{ github.event.deployment.id }}" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/health >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/api/v1/app/version > "$RUNNER_TEMP/app-version.json"
          jq -e --arg version "$VERSION" '.success == true and .data.web.latestVersion == $version' "$RUNNER_TEMP/app-version.json"

      - name: Record immutable production proof
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --argjson workflow_run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg candidate "$CANDIDATE_SHA" --arg production "$PRODUCTION_SHA" --arg tree "$PRODUCTION_TREE" --arg version "$VERSION" --arg active_railway "$ACTIVE_RAILWAY_DEPLOYMENT_ID" --argjson production_pr "$PRODUCTION_PR" --argjson preparation_pr "$PREPARATION_PR" --argjson staging_run "$STAGING_RUN_ID" --argjson gate_run "$GATE_RUN_ID" --argjson gate_attempt "$GATE_ATTEMPT" --argjson gate_job "$GATE_JOB_ID" --argjson migrations "$MIGRATION_CHANGED" --argjson frontend "$FRONTEND_DEPLOYMENT_ID" --argjson landing "$LANDING_DEPLOYMENT_ID" --argjson railway_status "$RAILWAY_DEPLOYMENT_ID" '{repository:$repository,workflow_run_id:$workflow_run_id,run_attempt:$run_attempt,version:$version,production_pr:$production_pr,preparation_pr:$preparation_pr,candidate_sha:$candidate,production_sha:$production,tree_sha:$tree,staging_run_id:$staging_run,release_gate:{run_id:$gate_run,attempt:$gate_attempt,job_id:$gate_job},migrations_applied:$migrations,deployments:{frontend:$frontend,landing:$landing,railway_status:$railway_status,railway_active:$active_railway}}' > production-proof.json

      - name: Upload production proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-proof-${{ github.event.deployment.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: production-proof.json
          retention-days: 90
          if-no-files-found: error

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PULPE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PULPE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pulpe

      - name: Publish the immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$PRODUCTION_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PREPARATION_PR" > "$RUNNER_TEMP/preparation-pr.json"
          notes="$RUNNER_TEMP/release-notes.md"
          jq -r .body "$RUNNER_TEMP/preparation-pr.json" | sed -n "/^## v$VERSION$/,$ p" > "$notes"
          test "$(sed -n '1p' "$notes")" = "## v$VERSION"

          encoded_tag=$(jq -rn --arg value "v$VERSION" '$value | @uri')
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$encoded_tag" > "$RUNNER_TEMP/tags.json"
          tag_count=$(jq --arg ref "refs/tags/v$VERSION" '[.[] | select(.ref == $ref)] | length' "$RUNNER_TEMP/tags.json")
          if [ "$tag_count" = 0 ]; then
            jq -n --arg tag "v$VERSION" --arg message "v$VERSION" --arg object "$PRODUCTION_SHA" '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/tag.json"
            tag_sha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)
            jq -n --arg ref "refs/tags/v$VERSION" --arg sha "$tag_sha" '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/ref.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/ref.json" >/dev/null
          else
            test "$tag_count" = 1
            tag_sha=$(jq -r --arg ref "refs/tags/v$VERSION" '.[] | select(.ref == $ref) | .object.sha' "$RUNNER_TEMP/tags.json")
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)" = "$PRODUCTION_SHA"
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > "$RUNNER_TEMP/releases.jsonl"
          release_count=$(jq -s --arg tag "v$VERSION" '[.[] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.jsonl")
          if [ "$release_count" = 0 ]; then
            jq -n --arg tag "v$VERSION" --arg target "$PRODUCTION_SHA" --arg name "v$VERSION" --rawfile body "$notes" '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}' > "$RUNNER_TEMP/release.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/release.json" --jq .html_url
          else
            jq -se --arg tag "v$VERSION" --arg target "$PRODUCTION_SHA" --rawfile body "$notes" '[.[] | select(.tag_name == $tag)] | length == 1 and .[0].target_commitish == $target and .[0].name == $tag and .[0].body == $body and .[0].draft == false and .[0].prerelease == false' "$RUNNER_TEMP/releases.jsonl"
          fi

      - name: 📊 Create PostHog annotation
        env:
          POSTHOG_HOST: https://eu.i.posthog.com
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_WEBAPP_PROJECT_ID }}
        run: |
          commit="${PRODUCTION_SHA::7}"
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X POST "${POSTHOG_HOST}/api/projects/${POSTHOG_PROJECT_ID}/annotations/" \
            -H "Authorization: Bearer ${POSTHOG_PERSONAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"v${VERSION} (${commit})\",\"scope\":\"project\",\"date_marker\":\"${date}\"}" \
            || echo "::warning::PostHog annotation failed"
