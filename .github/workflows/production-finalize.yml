name: ✅ Production Finalized

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  verify:
    name: 🔎 Verify exact production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_SHA: ${{ github.sha }}
    outputs:
      ios: ${{ steps.metadata.outputs.ios }}
    steps:
      - name: Checkout exact approved production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read approved release metadata
        id: metadata
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/production" --jq .commit.sha)" = "$GITHUB_SHA"
          node .github/scripts/validate-release-manifest.mjs --file .release/manifest.json --product-version "$VERSION" >/dev/null
          ios=null
          if [ -f ios/app-store-release.json ] && [ "$(jq -r .productVersion ios/app-store-release.json)" = "$VERSION" ]; then
            ios=$(jq -c . ios/app-store-release.json)
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

      - name: Verify exact Vercel deployments and public services
        id: providers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          deployment() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" -f environment="$1" -f sha="$PRODUCTION_SHA" -f per_page=100 | jq -r --arg sha "$PRODUCTION_SHA" '[.[] | select(.sha == $sha and .ref == $sha and .creator.login == "vercel[bot]")] | max_by(.id) | .id // empty'
          }
          state() { gh api "repos/$GITHUB_REPOSITORY/deployments/$1/statuses" --jq '[.[] | select(.creator.login == "vercel[bot]")] | max_by(.id) | select((.environment_url // "" | startswith("https://")) and .log_url == .environment_url and .target_url == .environment_url) | .state // empty'; }
          for _ in {1..60}; do
            frontend_id=$(deployment "Production – pulpe-frontend")
            landing_id=$(deployment "Production – pulpe-landing")
            frontend_state=${frontend_id:+$(state "$frontend_id")}
            landing_state=${landing_id:+$(state "$landing_id")}
            case "$frontend_state $landing_state" in *error*|*failure*) exit 1 ;; esac
            if [ "$frontend_state $landing_state" = "success success" ]; then break; fi
            sleep 10
          done
          test "$frontend_state $landing_state" = "success success"
          curl --fail --silent --show-error --location --max-time 20 https://app.pulpe.app/ >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://pulpe.app/ >/dev/null
          echo "frontend_deployment_id=$frontend_id" >> "$GITHUB_OUTPUT"
          echo "landing_deployment_id=$landing_id" >> "$GITHUB_OUTPUT"

  publish:
    name: ✅ Publish proven production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      PRODUCTION_SHA: ${{ github.sha }}
      VERSION: ${{ inputs.version }}
      RAILWAY_CLI_VERSION: "5.15.0"
      RAILWAY_CLI_SHA256: d302113b772b8f34d28ed2242c1d258953de989c282d4cc72291239ccb0fb041
      RAILWAY_PROJECT: 33ba829c-d4d6-4096-b0dc-57c89c367063
      RAILWAY_SERVICE: b1f9b1c0-7eca-4c58-b203-cdbbed8ae0a4
    steps:
      - name: Checkout exact approved production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Railway CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway.tar.gz"
          bin_dir="$RUNNER_TEMP/railway-cli"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 60 --location "https://github.com/railwayapp/cli/releases/download/v$RAILWAY_CLI_VERSION/railway-v$RAILWAY_CLI_VERSION-x86_64-unknown-linux-gnu.tar.gz" --output "$archive"
          echo "$RAILWAY_CLI_SHA256  $archive" | sha256sum --check
          mkdir -p "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir"
          test -x "$bin_dir/railway"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify active Railway production deployment
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          for _ in {1..90}; do
            railway deployment list --project "$RAILWAY_PROJECT" --environment production --service "$RAILWAY_SERVICE" --limit 50 --json > "$RUNNER_TEMP/railway.json"
            if jq -e --arg sha "$PRODUCTION_SHA" '.[0].status == "SUCCESS" and .[0].meta.commitHash == $sha and .[0].meta.branch == "production"' "$RUNNER_TEMP/railway.json" >/dev/null; then break; fi
            sleep 10
          done
          jq -e --arg sha "$PRODUCTION_SHA" '.[0].status == "SUCCESS" and .[0].meta.commitHash == $sha and .[0].meta.branch == "production"' "$RUNNER_TEMP/railway.json" >/dev/null

      - name: Verify public backend after exact Railway deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/health > "$RUNNER_TEMP/health.json"
          jq -e '.status == "healthy"' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --location --max-time 20 https://api.pulpe.app/api/v1/app/version > "$RUNNER_TEMP/version.json"
          jq -e --arg version "$VERSION" '.success == true and .data.web.latestVersion == $version' "$RUNNER_TEMP/version.json"

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PULPE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PULPE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pulpe

      - name: Publish exact tag and GitHub Release idempotently
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$PRODUCTION_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/production" --jq .commit.sha)" = "$PRODUCTION_SHA"
          node .github/scripts/validate-release-manifest.mjs --file .release/manifest.json --product-version "$VERSION" >/dev/null
          jq -r .githubReleaseNotes .release/manifest.json > "$notes"
          encoded_tag=$(jq -rn --arg value "v$VERSION" '$value | @uri')

          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$encoded_tag" > "$RUNNER_TEMP/tags.json"
          tag_count=$(jq --arg ref "refs/tags/v$VERSION" '[.[] | select(.ref == $ref)] | length' "$RUNNER_TEMP/tags.json")
          if [ "$tag_count" = 0 ]; then
            tag_object=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="v$VERSION" -f object="$PRODUCTION_SHA" -f type=commit --jq .sha)
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_object" >/dev/null
          else
            test "$tag_count" = 1
            tag_object=$(jq -r --arg ref "refs/tags/v$VERSION" '.[] | select(.ref == $ref) | .object.sha' "$RUNNER_TEMP/tags.json")
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag.json"
            jq -e --arg tag "v$VERSION" --arg sha "$PRODUCTION_SHA" '.tag == $tag and .object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/tag.json"
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > "$RUNNER_TEMP/releases.jsonl"
          release_count=$(jq -s --arg tag "v$VERSION" '[.[] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.jsonl")
          if [ "$release_count" = 0 ]; then
            jq -n --arg tag "v$VERSION" --arg sha "$PRODUCTION_SHA" --slurpfile manifest .release/manifest.json '{tag_name:$tag,target_commitish:$sha,name:$tag,draft:false,prerelease:false,generate_release_notes:false,body:$manifest[0].githubReleaseNotes}' | gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .html_url
          else
            jq -se --arg tag "v$VERSION" --arg target "$PRODUCTION_SHA" --slurpfile manifest .release/manifest.json '[.[] | select(.tag_name == $tag)] | length == 1 and .[0].target_commitish == $target and .[0].name == $tag and .[0].body == $manifest[0].githubReleaseNotes and .[0].draft == false and .[0].prerelease == false' "$RUNNER_TEMP/releases.jsonl"
          fi

      - name: Read back published tag and exact notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" | jq -e --arg sha "$PRODUCTION_SHA" '.object.type == "commit" and .object.sha == $sha'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" | jq -e --arg sha "$PRODUCTION_SHA" --arg tag "v$VERSION" --slurpfile manifest .release/manifest.json '.target_commitish == $sha and .tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .body == $manifest[0].githubReleaseNotes'

  ios:
    name: 🍎 Submit approved iOS release
    needs: [verify, publish]
    if: needs.verify.outputs.ios != 'null'
    uses: ./.github/workflows/ios-distribute.yml
    with:
      channel: release
      source_sha: ${{ github.sha }}
      marketing_version: ${{ fromJSON(needs.verify.outputs.ios).marketingVersion }}
      build_number: ${{ fromJSON(needs.verify.outputs.ios).buildNumber }}
    secrets: inherit
