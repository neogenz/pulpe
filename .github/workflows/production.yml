name: 🏭 Production Release

# Réutilisable uniquement : aucun trigger automatique. L'unique caller est le
# mode publish de release-promotion.yml, dispatché sur main; chaque mutation
# reste derrière l'environnement GitHub production.
on:
  workflow_call:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: 🔐 Authorize proven release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      anchor_sha: ${{ steps.release.outputs.anchor_sha }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      migration_changed: ${{ steps.migrations.outputs.changed }}
      preparation_pr: ${{ steps.release.outputs.preparation_pr }}
      production_tree: ${{ steps.release.outputs.production_tree }}
      staging_run_id: ${{ steps.release.outputs.staging_run_id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release automation without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the approved release and staging proof
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          # GITHUB_SHA est le merge commit de l'unique PR de préparation
          # `release/vX.Y.Z` → main. La PR est ouverte par le releaser (owner)
          # via la skill; l'App reste acceptée pour une préparation
          # automatisée.
          owner="${GITHUB_REPOSITORY%%/*}"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/pulls.json"
          jq -e --arg sha "$GITHUB_SHA" --arg owner "$owner" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha and (.user.login == "pulpe-release[bot]" or .user.login == $owner))] | length == 1' "$RUNNER_TEMP/pulls.json"
          jq '[.[] | select(.base.ref == "main" and .merge_commit_sha == env.GITHUB_SHA)][0]' "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/preparation-pr.json"

          preparation_pr=$(jq -r .number "$RUNNER_TEMP/preparation-pr.json")
          release_branch=$(jq -r .head.ref "$RUNNER_TEMP/preparation-pr.json")
          [[ "$release_branch" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          candidate_sha="$GITHUB_SHA"

          release_sha=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$preparation_pr/commits?per_page=100" --jq '.[].sha' | tail -n 1)
          test -n "$release_sha"
          test "$(jq -r '.body | split("\n")[0]' "$RUNNER_TEMP/preparation-pr.json")" = "<!-- pulpe-release:v$version:$release_sha -->"

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$preparation_pr/reviews?per_page=100" --jq '.[]' > "$RUNNER_TEMP/reviews.jsonl"
          jq -se 'any(.state == "APPROVED" and .user.type == "User" and .user.login != "pulpe-release[bot]")' "$RUNNER_TEMP/reviews.jsonl"

          gh api "repos/$GITHUB_REPOSITORY/git/commits/$candidate_sha" > "$RUNNER_TEMP/candidate.json"
          release_base=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$release_sha" --jq '.parents[0].sha')
          jq -e --arg release "$release_sha" --arg base "$release_base" '(.parents | length) == 2 and .parents[0].sha == $base and .parents[1].sha == $release' "$RUNNER_TEMP/candidate.json"
          production_tree=$(jq -r .tree.sha "$RUNNER_TEMP/candidate.json")

          staging=$(node .github/scripts/resolve-workflow-proof.mjs \
            --workflow staging-proof.yml \
            --event push \
            --branch main \
            --sha "$candidate_sha" \
            --job "✅ Staging Ready (shadow)" \
            --artifact-template "staging-proof-{sha}-run-{run_id}-attempt-{attempt}")
          proof_run_id=$(jq -r .run_id <<< "$staging")
          proof_attempt=$(jq -r .attempt <<< "$staging")
          artifact=$(jq -r .artifact_name <<< "$staging")
          staging_run_id="$proof_run_id"
          gh run download "$proof_run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/staging-proof"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg candidate "$candidate_sha" --arg tree "$production_tree" --argjson pr "$preparation_pr" --argjson run "$proof_run_id" --argjson attempt "$proof_attempt" '.repository == $repository and .candidate_sha == $candidate and .tree_sha == $tree and .pr_number == $pr and .staging_run_id == $run and .staging_run_attempt == $attempt' "$RUNNER_TEMP/staging-proof/staging-proof.json"

          gh api -X GET "repos/$GITHUB_REPOSITORY/contents/package.json" -f ref="$GITHUB_SHA" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/package.json"
          test "$(jq -r .version "$RUNNER_TEMP/package.json")" = "$version"
          # Le candidat doit rester le tip de main jusqu'à l'approbation :
          # avec un seul staging durable, l'approbateur valide le SHA visible.
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"

          # L'ancre de rollback — la dernière release publiée, ancêtre de
          # main — est aussi la base des migrations : la production sert son
          # schéma, et les migrations arrivent sur main par les PR de
          # features, pas par la PR de préparation.
          published_main=$(node .github/scripts/resolve-workflow-proof.mjs --published-main "$GITHUB_SHA")
          anchor_sha=$(jq -r .sha <<< "$published_main")

          {
            echo "anchor_sha=$anchor_sha"
            echo "preparation_pr=$preparation_pr"
            echo "candidate_sha=$candidate_sha"
            echo "production_tree=$production_tree"
            echo "staging_run_id=$staging_run_id"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: 🔍 Detect migration changes
        id: migrations
        env:
          ANCHOR_SHA: ${{ steps.release.outputs.anchor_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$ANCHOR_SHA" "$GITHUB_SHA" -- backend-nest/supabase/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: 🗄️ Apply production migrations
    needs: authorize
    if: needs.authorize.outputs.migration_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: 📥 Checkout authorized production tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛡️ Verify migration contract
        env:
          ANCHOR_SHA: ${{ needs.authorize.outputs.anchor_sha }}
        run: node .github/scripts/check-migration-contract.cjs "$ANCHOR_SHA" "$GITHUB_SHA"

      - name: 🗄️ Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli
        with:
          version: "2.113.0"

      - name: 🔗 Link Supabase project
        working-directory: backend-nest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: 🧪 Dry-run migrations
        working-directory: backend-nest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: 🚀 Apply migrations
        working-directory: backend-nest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: supabase db push

  # Avance le pointeur `production` sur le merge SHA autorisé, en fast-forward
  # strict (force=false) : c'est ce push qui déclenche les déploiements
  # production Vercel et Railway, une fois les migrations déjà appliquées.
  advance:
    name: ⏩ Advance production pointer
    needs: [authorize, migrate]
    if: ${{ always() && needs.authorize.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PULPE_RELEASE_APP_ID }}
          private-key: ${{ secrets.PULPE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pulpe

      - name: Fast-forward production to the authorized merge SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" -f sha="$GITHUB_SHA" -F force=false >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"

  prepare:
    name: 🚦 Record production authorization
    needs: [authorize, migrate, advance]
    if: ${{ always() && needs.authorize.result == 'success' && needs.advance.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - name: Wait for exact web client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in {1..60}; do
            deployment_id=$(gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" -f environment="Production – pulpe-frontend" -f sha="$GITHUB_SHA" -f per_page=100 | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.sha == $sha and .ref == $sha and .creator.login == "vercel[bot]")] | max_by(.id) | .id // empty')
            state=${deployment_id:+$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq 'max_by(.id) | .state // empty')}
            case "$state" in error|failure) exit 1 ;; success) break ;; esac
            sleep 10
          done
          test "$state" = success

      - name: Record authorized production context
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg production "$GITHUB_SHA" --arg candidate "${{ needs.authorize.outputs.candidate_sha }}" --arg tree "${{ needs.authorize.outputs.production_tree }}" --arg version "$VERSION" --arg anchor "${{ needs.authorize.outputs.anchor_sha }}" --argjson workflow_run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson preparation_pr "${{ needs.authorize.outputs.preparation_pr }}" --argjson staging_run_id "${{ needs.authorize.outputs.staging_run_id }}" --argjson migrations_applied "${{ needs.authorize.outputs.migration_changed }}" '{repository:$repository,production_sha:$production,candidate_sha:$candidate,tree_sha:$tree,version:$version,anchor_sha:$anchor,workflow_run_id:$workflow_run_id,run_attempt:$run_attempt,preparation_pr:$preparation_pr,staging_run_id:$staging_run_id,migration_changed:$migrations_applied}' > production-context.json

      - name: Upload authorized production context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-context-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: production-context.json
          retention-days: 90
          if-no-files-found: error
