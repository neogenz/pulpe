name: 🚀 CI Pipeline

on:
  pull_request:
    branches: [preview]

# Éviter les runs multiples pour la même ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sécurité : token en lecture seule. Les diagnostics E2E passent par les
# reporters Playwright natifs (annotations github, JUnit, blob) et les
# artefacts — aucun job n'écrit sur la PR ni ne crée de check run.
permissions:
  contents: read

# Variables globales
env:
  # Angular 22 requires >= 22.22.3 / 24.15.0 / 26. Vercel's 22.x image sits at
  # 22.22.2, so the whole pipeline runs on 24 to match engines.node.
  NODE_VERSION: "24"
  PNPM_VERSION: "10.12.1"
  BUN_VERSION: "1.2.17"
  # Pinned: "latest" resolves via unauthenticated GitHub Releases API and can rate-limit setup jobs.
  SUPABASE_CLI_VERSION: "2.113.0"

  # CI-only npm/pnpm tweaks — mitigate NPM 429s, keep local .npmrc clean
  NPM_CONFIG_FETCH_RETRIES: "3"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "120000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "600000"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "10"
  NPM_CONFIG_FETCH_TIMEOUT: "120000"
  NPM_CONFIG_NETWORK_CONCURRENCY: "3"
  NPM_CONFIG_MAXSOCKETS: "5"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_PROGRESS: "false"

jobs:
  # 🧭 CLASSIFY — décide quelles unités cette PR doit prouver. Le classifier
  # Git ne possède que les frontières hors graphe (automation GitHub, iOS,
  # miroir de formules, branches release, contrats racine); les fichiers de
  # packages pnpm passent par `turbo query` pour que le graphe existant reste
  # l'unique source des dépendances. Toute erreur ou surface inconnue produit
  # un run complet, et si ce job échoue, ci-success reste rouge : aucune unité
  # ne peut être sautée sans une décision valide qui la déclare non requise.
  classify:
    name: 🧭 Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      automation: ${{ steps.decision.outputs.automation }}
      workspace: ${{ steps.decision.outputs.workspace }}
      backend_db: ${{ steps.decision.outputs.backend_db }}
      e2e: ${{ steps.decision.outputs.e2e }}
      ios: ${{ steps.decision.outputs.ios }}
      scope: ${{ steps.decision.outputs.scope }}
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - name: 📥 Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      # --ignore-scripts : seule la présence du binaire turbo compte ici.
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧭 Classify changes
        id: decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          decision=$(node .github/scripts/classify-ci-changes.mjs \
            --base "$BASE_SHA" --head "$HEAD_SHA" --head-ref "$HEAD_REF")
          echo "$decision" | jq .
          {
            for unit in automation workspace backend_db e2e ios; do
              echo "$unit=$(echo "$decision" | jq -r ".units.$unit")"
            done
            echo "scope=$(echo "$decision" | jq -r .scope)"
            echo "decision=$decision"
          } >> "$GITHUB_OUTPUT"

  # 🧾 AUTOMATION — la part du gate quality qui vit hors des packages :
  # format des workflows, invariants CI/release/routage, lexique produit.
  # Ne tourne que quand le workspace ne tourne pas — son gate quality est un
  # sur-ensemble strict de cette unité.
  automation:
    name: 🧾 Automation Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [classify]
    if: needs.classify.outputs.automation == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run automation quality gates
        run: pnpm quality:automation

  migration-contract:
    name: 🛡️ Migration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout full migration history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🛡️ Check migration contract
        run: node --test .github/scripts/migration-contract.test.cjs

      - name: 🛡️ Validate changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-migration-contract.cjs "$BASE_SHA" "$HEAD_SHA"

  # 🗄️ BACKEND & DATABASE — le runner DB unique : une seule stack Supabase
  # sert les suites SQL, la vérification des types puis l'intégration backend.
  # postgres-meta n'existe que pour `gen types` : son image n'est tirée que si
  # le contrat DB (migrations, config.toml, database.types.ts) change dans la
  # PR — un changement Nest pur démarre la stack sans lui. Tourne en parallèle
  # du workspace : rien ici ne consomme un artefact de build, et aucun état
  # Supabase ne transite plus entre runners.
  backend-db:
    name: 🗄️ Backend & Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify]
    if: needs.classify.outputs.backend_db == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD est le merge synthétique de la PR : profondeur 2 embarque ses
          # deux parents, assez pour diff HEAD^1..HEAD — l'effet exact de la PR.
          fetch-depth: 2

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 🗄️ Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Detect DB contract changes
        id: db
        run: |
          set -euo pipefail
          # Fail closed : sans parent de merge résolvable, vérifier les types.
          contract=true
          if base=$(git rev-parse -q --verify HEAD^1); then
            changed=$(git diff --name-only "$base" HEAD -- \
              backend-nest/supabase/migrations \
              backend-nest/supabase/config.toml \
              backend-nest/src/types/database.types.ts)
            [ -n "$changed" ] || contract=false
          fi
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "DB contract changed: $contract"

      - name: 🐳 Start Supabase Local
        id: start-supabase
        working-directory: backend-nest
        env:
          SUPABASE_SKIP_PG_META: ${{ steps.db.outputs.contract == 'true' && '0' || '1' }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/start-supabase.sh"

          # Health check — REST (postgrest) d'abord, sur le timeout long du
          # démarrage à froid.
          timeout=180
          counter=0
          until curl -s http://127.0.0.1:54321/rest/v1/ >/dev/null; do
            if [ $counter -gt $timeout ]; then
              echo "❌ Timeout waiting for Supabase"
              supabase status
              exit 1
            fi
            sleep 1
            counter=$((counter + 1))
          done

          # GoTrue boots last (DB migrations at startup) and the encryption
          # integration/e2e specs probe /auth/v1/health (reachable = status < 500).
          # Mirror that exact criterion here so tests never start before auth is up.
          timeout=60
          counter=0
          until code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/auth/v1/health); [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; do
            if [ $counter -gt $timeout ]; then
              echo "❌ Supabase auth (GoTrue) not ready"
              supabase status
              exit 1
            fi
            sleep 1
            counter=$((counter + 1))
          done
          echo "✅ Supabase ready"

          # Export local Supabase keys as outputs (using heredoc for robust special character handling).
          # Newer local stacks may only expose sb_publishable_/sb_secret_ keys
          # (PUBLISHABLE_KEY/SECRET_KEY) — fall back to those when the legacy
          # JWT keys are absent.
          status_env="$(supabase status -o env 2>/dev/null)"
          read_status_env() { echo "$status_env" | grep "^$1=" | cut -d'=' -f2- | tr -d '"'; }
          anon_key="$(read_status_env ANON_KEY)"
          [ -n "$anon_key" ] || anon_key="$(read_status_env PUBLISHABLE_KEY)"
          service_key="$(read_status_env SERVICE_ROLE_KEY)"
          [ -n "$service_key" ] || service_key="$(read_status_env SECRET_KEY)"
          {
            echo 'SUPABASE_URL<<EOF'
            read_status_env API_URL
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'SUPABASE_ANON_KEY<<EOF'
            echo "$anon_key"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'SUPABASE_SERVICE_ROLE_KEY<<EOF'
            echo "$service_key"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Couvre la couche SQL, que les tests Bun mockent par construction :
      # RPC SECURITY DEFINER, RLS, triggers, casts d'enum. Chaque suite
      # s'ouvre sur BEGIN et finit sur ROLLBACK, donc l'ordre n'importe pas
      # et rien ne fuit d'une suite à l'autre. Une exception assumée :
      # savings_goal_plan_concurrency.sql fait courir deux vraies sessions, qui
      # ne verraient rien d'une transaction non commitée. Elle commite donc sa
      # fixture. En cas d'erreur elle la capture, termine le bloc, supprime la
      # fixture dans une instruction autocommittée indépendante, puis rethrow
      # dans une dernière instruction ; c'est le seul endroit où l'isolation
      # repose sur le nettoyage plutôt que sur le ROLLBACK.
      #
      # ON_ERROR_STOP n'est PAS décoratif : sans lui psql imprime l'erreur et
      # sort quand même en 0, l'étape passe au vert avec des assertions
      # cassées. Le glob évite la liste en dur du README, qui a déjà dérivé.
      - name: 🧪 SQL Integration Tests
        working-directory: backend-nest
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(supabase/tests/*.sql)
          # `nullglob` seul transformerait un dossier vide en étape verte n'ayant
          # rien exécuté — le faux vert exact que cette étape existe pour éviter.
          # D'où le compte, annoncé aussi au succès : une suite qui disparaît du
          # dossier se lit dans le journal au lieu de passer inaperçue.
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no SQL suite found in backend-nest/supabase/tests/"
            exit 1
          fi
          for f in "${suites[@]}"; do
            echo "▶ $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "✅ ${#suites[@]} SQL suites passed"

      # Génère dans un fichier temporaire et compare : une redirection directe
      # tronquerait le fichier suivi avant même que la commande ait réussi, et
      # un fichier réécrit en CI masquerait une dérive du type commité.
      # Conditionné au contrat DB : sans changement de schéma, le fichier suivi
      # est réputé fidèle et postgres-meta n'a même pas démarré.
      - name: 🔧 Verify TypeScript Types
        if: steps.db.outputs.contract == 'true'
        working-directory: backend-nest
        run: |
          set -euo pipefail
          echo "📝 Generating TypeScript types from local schema..."
          generated="$RUNNER_TEMP/database.types.ts"
          trap 'rm -f "$generated"' EXIT
          supabase gen types typescript --local > "$generated"
          if [ ! -s "$generated" ]; then
            echo "::error::generated types are empty"
            exit 1
          fi
          if ! diff -u src/types/database.types.ts "$generated"; then
            echo "::error::src/types/database.types.ts drifts from the local schema — run 'bun run generate-types:local' in backend-nest and commit the result"
            exit 1
          fi
          echo "✅ Committed types match the local schema"

      - name: 🔧 Setup CI Environment
        working-directory: backend-nest
        run: |
          echo "📝 Creating CI environment file..."
          cp .env.ci .env
          # Get keys dynamically from local Supabase instance
          echo "SUPABASE_URL=$(supabase status -o env 2>/dev/null | grep API_URL | cut -d'=' -f2 | tr -d '\"')" >> .env
          echo "SUPABASE_ANON_KEY=$(supabase status -o env 2>/dev/null | grep ANON_KEY | cut -d'=' -f2 | tr -d '\"')" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env 2>/dev/null | grep SERVICE_ROLE_KEY | cut -d'=' -f2 | tr -d '\"')" >> .env
          # Turnstile verification is skipped in test environment, dummy value is sufficient
          echo "TURNSTILE_SECRET_KEY=ci-test-turnstile-key" >> .env
          echo "ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" >> .env
          echo "✅ Environment ready"

      - name: 🔌 Run backend integration tests
        working-directory: backend-nest
        run: bun test .integration.spec .e2e.spec
        env:
          NODE_ENV: test
          RUN_INTEGRATION_TESTS: "true"
          SUPABASE_URL: ${{ steps.start-supabase.outputs.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ steps.start-supabase.outputs.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.start-supabase.outputs.SUPABASE_SERVICE_ROLE_KEY }}
          TURNSTILE_SECRET_KEY: ci-test-turnstile-key
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: 🩺 Supabase diagnostics on failure
        if: failure()
        working-directory: backend-nest
        run: |
          supabase status || true
          echo "===== status -o env key names ====="
          supabase status -o env 2>/dev/null | cut -d'=' -f1 | sort || true
          docker ps -a || true
          for container in $(docker ps -aq --filter "name=supabase"); do
            echo "===== logs: $(docker inspect --format '{{.Name}}' "$container") ====="
            docker logs --tail 80 "$container" 2>&1 | tail -80 || true
          done

      - name: 🧹 Cleanup Supabase
        if: always() && steps.start-supabase.outcome == 'success'
        working-directory: backend-nest
        run: supabase stop || true

  # 🧰 WORKSPACE — l'unité Node unique : build, tests unitaires et gates
  # quality partagent un runner, une seule installation pnpm et le cache Turbo
  # local (lint/format des sous-tâches turbo se dédoublonnent d'eux-mêmes).
  # Chaque gate reste une étape distincte pour un diagnostic par commande.
  # Les types Supabase versionnés sont vérifiés par backend-db : compiler
  # ne parle à aucune base, donc aucune dépendance ni artefact Supabase ici.
  workspace:
    name: 🧰 Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [classify]
    if: needs.classify.outputs.workspace == 'true'
    env:
      # `--affected` (build, unités, lint) laisse le graphe Turbo réduire le
      # travail aux packages touchés quand la décision est `routed`; un run
      # complet n'émet pas le flag et exécute tout. Les gates racine
      # (format:check, quality, deps:check, audit) restent entiers.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
      TURBO_AFFECTED: ${{ needs.classify.outputs.scope == 'affected' && '1' || '' }}
    steps:
      - name: 📥 Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all projects
        env:
          DOTENV_CONFIG_PATH: .env.e2e
        run: pnpm build ${TURBO_AFFECTED:+"--affected"}

      - name: 🧪 Run unit tests
        run: pnpm test:unit ${TURBO_AFFECTED:+"--affected"}
        env:
          NODE_ENV: test
          TURNSTILE_SECRET_KEY: ci-test-turnstile-key
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: 🔍 Lint
        run: pnpm lint ${TURBO_AFFECTED:+"--affected"}

      - name: 🔍 Check formatting
        run: pnpm format:check

      - name: 🔍 Run quality gate
        run: pnpm quality

      - name: 🔍 Check dependency graphs
        run: pnpm deps:check

      - name: 🔍 Audit critical dependencies
        run: pnpm audit:critical

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: |
            shared/dist/
            frontend/dist/
            backend-nest/dist/
          retention-days: 1

  # 🎭 E2E TESTS — un seul runner : Playwright parallélise les deux projets
  # en interne avec un seul checkout, une installation pnpm, un Chromium et
  # un webServer Angular. Les projets sont sélectionnés explicitement pour que
  # `Chromium - Smoke` ou un futur projet ne s'ajoute jamais implicitement.
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [classify, workspace]
    if: needs.classify.outputs.e2e == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts

      - name: 🎭 Install Playwright (Chromium only)
        run: cd frontend && pnpm exec playwright install chromium --with-deps

      - name: 🎭 Run E2E tests
        run: cd frontend && pnpm test:e2e --project="Critical User Journeys (Mocked)" --project="Feature Tests (Mocked)"

      - name: 📤 Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # 🕵️ LINT DES WORKFLOWS — Prettier aligne la forme, actionlint relit le fond :
  # expressions ${{ }}, références de job, labels de runner, entrées d'action, et
  # shellcheck sur chaque bloc `run:`. Ne dépend ni de pnpm ni du build, donc il
  # rend son verdict en parallèle du reste au lieu d'attendre la chaîne complète.
  actionlint:
    name: 🕵️ Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Même convention que setup-supabase-cli : archive épinglée, somme vérifiée
      # avant extraction. Un changement de version doit remplacer les deux valeurs.
      - name: 🕵️ Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          # Plancher de sévérité plutôt qu'une liste de règles tues : shellcheck
          # n'est pas épinglé, il vient de l'image du runner, et une version plus
          # récente ajoute des remarques `info` sans que rien n'ait bougé ici —
          # exclure les règles une à une revient à courir après l'image. `warning`
          # et au-dessus, là où vivent les vrais défauts de shell, reste actif.
          SHELLCHECK_OPTS: -S warning
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::actionlint checksum is pinned for linux amd64 only"
            exit 1
          fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o "$archive" "$url"
          if ! printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --status; then
            echo "::error::actionlint archive checksum mismatch"
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # 🍎 iOS UNIT TESTS
  test-ios:
    name: 🍎 iOS Unit Tests
    runs-on: macos-26
    timeout-minutes: 15
    needs: [classify]
    if: needs.classify.outputs.ios == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.2"

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: 💾 Cache SPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-

      - name: 🔨 Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: 📱 Resolve iOS Simulator
        id: sim
        run: |
          # Pick the first available iPhone 17 (iOS 26.2) — avoids duplicate-name ambiguity
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          for rt, devs in json.load(sys.stdin)['devices'].items():
            if '26-2' in rt:
              for d in devs:
                if d['name'] == 'iPhone 17':
                  print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run Unit Tests
        working-directory: ios
        env:
          NSUnbufferedIO: "YES"
        run: |
          # Workaround: xcodebuild hangs after tests on Xcode 26+ (actions/runner-images#13143)
          touch test-output.log
          # PulpeLocal compile l'app et le widget puis exécute PulpeTests —
          # l'unique invocation iOS de la CI (pas de second workflow de build).
          xcodebuild test \
            -scheme PulpeLocal \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            >> test-output.log 2>&1 &
          XCODE_PID=$!

          # Live filtered output
          tail -f test-output.log | grep --line-buffered -E '(✔|✘|Test Case|passed|failed|error:|Suite|TEST SUCCEEDED|TEST FAILED)' &
          TAIL_PID=$!

          # Wait for test completion or timeout (13 min — leaves 2 min buffer for 15 min step timeout)
          ELAPSED=0
          LAST_SIZE=0
          IDLE=0
          while kill -0 $XCODE_PID 2>/dev/null && [ $ELAPSED -lt 780 ]; do
            if grep -q '\*\* TEST SUCCEEDED \*\*\|\*\* TEST FAILED \*\*' test-output.log 2>/dev/null; then
              echo "📋 Tests finished, cleaning up xcodebuild..."
              sleep 5
              break
            fi

            # Workaround: detect xcodebuild post-test hang (Xcode 26+ #13143).
            # If log stops growing for 60s after suites have passed, treat as hang.
            CURRENT_SIZE=$(wc -c < test-output.log 2>/dev/null || echo 0)
            if [ "$CURRENT_SIZE" = "$LAST_SIZE" ]; then
              IDLE=$((IDLE + 10))
              if [ "$IDLE" -ge 60 ] && grep -q '✔ Suite' test-output.log 2>/dev/null && ! grep -q '✘' test-output.log 2>/dev/null; then
                echo "📋 No log activity for ${IDLE}s after passing suites — xcodebuild hung, proceeding"
                break
              fi
            else
              IDLE=0
              LAST_SIZE=$CURRENT_SIZE
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          kill $TAIL_PID 2>/dev/null || true
          kill $XCODE_PID 2>/dev/null || true

          if grep -q '\*\* TEST SUCCEEDED \*\*' test-output.log; then
            echo "✅ All tests passed"
            exit 0
          elif grep -q '\*\* TEST FAILED \*\*' test-output.log; then
            echo "❌ Tests failed"
            exit 1
          elif grep -q '✘' test-output.log; then
            echo "❌ Test failures detected (✘ found in output)"
            exit 1
          elif grep -q '✔' test-output.log && ! grep -q '✘' test-output.log; then
            PASS_COUNT=$(grep -c '✔' test-output.log || echo 0)
            echo "⚠️ xcodebuild hung before writing summary — ${PASS_COUNT} tests passed, no failures detected"
            if [ "$PASS_COUNT" -lt 50 ]; then  # ~120 tests currently — 50 catches partial runs
              echo "❌ Too few tests passed (${PASS_COUNT}) — likely hung before completing suite"
              exit 1
            fi
            exit 0
          else
            echo "⚠️ Could not determine test outcome"
            tail -30 test-output.log
            exit 1
          fi

      - name: 📋 Show failed tests (if any)
        if: failure()
        working-directory: ios
        run: |
          echo "=== FAILED TESTS ==="
          grep -E "(Test Case.*failed|✘|error:)" test-output.log || echo "No explicit failures found"
          echo "=== LAST 50 LINES ==="
          tail -50 test-output.log

      - name: 🧹 Cleanup Simulator
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true

  # ✅ SUCCESS JOB pour status checks — le seul required. Un job routé ne
  # peut être `skipped` que si la décision du classifier le déclare non
  # requis; toute autre issue (échec, annulation, skip non autorisé, classify
  # rouge) rend le check rouge au lieu de le laisser Pending.
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    needs:
      [
        classify,
        automation,
        workspace,
        backend-db,
        test-e2e,
        actionlint,
        test-ios,
        migration-contract,
      ]
    if: always()
    steps:
      - name: ✅ Check all jobs
        env:
          RESULT_CLASSIFY: ${{ needs.classify.result }}
          RESULT_AUTOMATION: ${{ needs.automation.result }}
          RESULT_WORKSPACE: ${{ needs.workspace.result }}
          RESULT_BACKEND_DB: ${{ needs.backend-db.result }}
          RESULT_E2E: ${{ needs.test-e2e.result }}
          RESULT_ACTIONLINT: ${{ needs.actionlint.result }}
          RESULT_IOS: ${{ needs.test-ios.result }}
          RESULT_MIGRATION: ${{ needs.migration-contract.result }}
          REQUIRED_AUTOMATION: ${{ needs.classify.outputs.automation }}
          REQUIRED_WORKSPACE: ${{ needs.classify.outputs.workspace }}
          REQUIRED_BACKEND_DB: ${{ needs.classify.outputs.backend_db }}
          REQUIRED_E2E: ${{ needs.classify.outputs.e2e }}
          REQUIRED_IOS: ${{ needs.classify.outputs.ios }}
        run: |
          set -euo pipefail
          fail=0
          require() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then
              echo "::error::$1 must succeed (got: $2)"
              fail=1
            fi
          }
          routed() {
            echo "$1: $2 (required: $3)"
            if [ "$2" = "success" ]; then return; fi
            if [ "$2" = "skipped" ] && [ "$3" = "false" ]; then return; fi
            echo "::error::$1 is required but finished '$2'"
            fail=1
          }
          require "Classify" "$RESULT_CLASSIFY"
          require "Workflow Lint" "$RESULT_ACTIONLINT"
          require "Migration Contract" "$RESULT_MIGRATION"
          routed "Automation Gates" "$RESULT_AUTOMATION" "$REQUIRED_AUTOMATION"
          routed "Workspace" "$RESULT_WORKSPACE" "$REQUIRED_WORKSPACE"
          routed "Backend & Database" "$RESULT_BACKEND_DB" "$REQUIRED_BACKEND_DB"
          routed "E2E Tests" "$RESULT_E2E" "$REQUIRED_E2E"
          routed "iOS Tests" "$RESULT_IOS" "$REQUIRED_IOS"
          if [ "$fail" -ne 0 ]; then
            echo "❌ Some CI checks failed"
            exit 1
          fi
          echo "🎉 All required CI checks passed!"

      - name: 📥 Checkout tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🧾 Record tested tree
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ROUTING: ${{ needs.classify.outputs.decision }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$(git rev-parse "${HEAD_SHA}^")" = "$BASE_SHA"
          fi
          tree_sha=$(git rev-parse "${GITHUB_SHA}^{tree}")
          TREE_SHA="$tree_sha" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          evidence = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_path": ".github/workflows/ci.yml",
              "base_ref": os.environ["BASE_REF"],
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
              "merge_sha": os.environ["MERGE_SHA"],
              "tree_sha": os.environ["TREE_SHA"],
              "routing": json.loads(os.environ["ROUTING"]),
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("ci-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, separators=(",", ":"))
          PY

      - name: 📤 Upload tested-tree evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-evidence-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ci-evidence.json
          retention-days: 14
          if-no-files-found: error
