name: Android E2E

on:
  pull_request:
    paths:
      - android/**
      - shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

concurrency:
  group: android-e2e-preview-account
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.12.1"
  MAESTRO_VERSION: "2.7.0"
  MAESTRO_SHA256: a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5
  MAESTRO_CLI_NO_ANALYTICS: "1"

jobs:
  smoke:
    name: Maestro smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Preview
    env:
      MAESTRO_EMAIL: ${{ secrets.MAESTRO_EMAIL }}
      MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_PIN: ${{ secrets.MAESTRO_PIN }}
      CI: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load preview build environment
        run: >-
          node -e 'const fs=require("node:fs"); const env=require("./android/eas.json").build.preview.env;
          for (const [key,value] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV, key+"="+value+"\n")'

      - name: Check E2E credentials
        run: |
          for name in MAESTRO_EMAIL MAESTRO_PASSWORD MAESTRO_PIN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the GitHub Preview environment"
              exit 1
            fi
          done

      - name: Build shared package
        run: pnpm build:shared

      - name: Generate Android project
        run: pnpm --filter pulpe-android native:generate

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build preview APK
        working-directory: android/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --no-daemon

      - name: Install Maestro
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro smoke
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            mkdir -p android/maestro-artifacts &&
            adb shell settings put system font_scale 1.3 &&
            adb install -r android/android/app/build/outputs/apk/release/app-release.apk &&
            adb shell pm clear app.pulpe.android &&
            adb shell cmd locale set-app-locales app.pulpe.android --user current --locales fr-FR &&
            maestro test android/maestro/smoke.yaml ||
            { status=$?; adb exec-out screencap -p > android/maestro-artifacts/failure.png || true; adb logcat -d > android/maestro-artifacts/logcat.txt || true; cp -R "$HOME/.maestro/tests" android/maestro-artifacts/maestro-tests || true; exit "$status"; }

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-maestro-failure
          path: android/maestro-artifacts/
          if-no-files-found: ignore
          retention-days: 7
