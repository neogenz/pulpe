name: "Setup Supabase CLI"
description: "Install a checksum-verified Supabase CLI archive with a resilient download cache"

inputs:
  version:
    description: "Supabase CLI version (without leading v)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Resolve verified release
      id: release
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch="amd64" ;;
          aarch64 | arm64) arch="arm64" ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac

        # Digests published by GitHub for the corresponding supabase/cli
        # release assets. A version bump must add both Linux architectures.
        case "${{ inputs.version }}:${arch}" in
          2.113.0:amd64)
            sha256="14659e7148ad17b77e69e5c36b27be572110519c76c796da1b53c07c3590f593"
            ;;
          2.113.0:arm64)
            sha256="e2697de24a58a10820cd631dd78ae1e1ef2fe5f6625f4447ca65624dbe86072e"
            ;;
          *)
            echo "::error::No verified checksum for Supabase CLI ${{ inputs.version }} on ${arch}"
            exit 1
            ;;
        esac

        echo "arch=${arch}" >> "$GITHUB_OUTPUT"
        echo "archive=supabase_linux_${arch}.tar.gz" >> "$GITHUB_OUTPUT"
        echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

    # Cache the pinned release archive, not the extracted binary. The checksum is
    # verified again on every hit before anything is extracted or executed.
    - name: Cache Supabase CLI archive
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 (was v4, aligned)
      with:
        path: ~/.cache/supabase-cli
        key: supabase-cli-${{ inputs.version }}-${{ runner.os }}-${{ steps.release.outputs.arch }}-${{ steps.release.outputs.sha256 }}

    - name: Download Supabase CLI archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive="$HOME/.cache/supabase-cli/${{ steps.release.outputs.archive }}"
        temporary_archive="$RUNNER_TEMP/${{ steps.release.outputs.archive }}"
        url="https://github.com/supabase/cli/releases/download/v${{ inputs.version }}/${{ steps.release.outputs.archive }}"
        echo "Downloading Supabase CLI ${{ inputs.version }} from $url"
        curl -fSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
          -o "$temporary_archive" "$url"
        if ! printf '%s  %s\n' "${{ steps.release.outputs.sha256 }}" "$temporary_archive" \
          | sha256sum --check --status; then
          echo "::error::Supabase CLI archive checksum mismatch"
          exit 1
        fi
        mkdir -p "$(dirname "$archive")"
        install -m 0644 "$temporary_archive" "$archive"

    - name: Verify and extract Supabase CLI
      shell: bash
      run: |
        set -euo pipefail
        archive="$HOME/.cache/supabase-cli/${{ steps.release.outputs.archive }}"
        if ! printf '%s  %s\n' "${{ steps.release.outputs.sha256 }}" "$archive" \
          | sha256sum --check --status; then
          echo "::error::Supabase CLI cached archive checksum mismatch"
          exit 1
        fi
        dest="$HOME/.local/share/supabase-cli"
        mkdir -p "$dest"
        tar -xzf "$archive" -C "$dest" supabase

    - name: Add Supabase CLI to PATH
      shell: bash
      run: |
        set -euo pipefail
        dest="$HOME/.local/share/supabase-cli"
        chmod +x "$dest/supabase"
        echo "$dest" >> "$GITHUB_PATH"

    # Public ECR throttles anonymous pulls per NAT pool and GitHub runners
    # share one. The pinned CLI (supabase/cli#5786) resolves every stack image
    # from this mirror instead, for all supabase commands run after this action.
    - name: Route Supabase images through the GHCR mirror
      shell: bash
      run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"

    - name: Verify installation
      shell: bash
      run: supabase --version
