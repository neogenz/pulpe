<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Pulpe — une branche, deux PR</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Manrope:ital,wght@0,600;0,700;0,800;1,600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --paper: #f7f6f3;
        --surface: #fffefa;
        --surface-alt: #eaf0e5;
        --ink: #1a1c19;
        --muted: #434841;
        --soft: #737970;
        --rule: rgba(26, 28, 25, 0.12);
        --rule-solid: #bfcaba;
        --accent: #006e25;
        --accent-tint: rgba(0, 110, 37, 0.08);
        --link: #0061a6;
        --font-display: "Manrope", sans-serif;
        --font-sans: "DM Sans", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
      }

      body {
        min-height: 100vh;
        padding: 32px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
      }

      main {
        width: min(100%, 1280px);
        margin: 0 auto;
      }

      .eyebrow {
        margin-bottom: 8px;
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 880px;
        font-family: var(--font-display);
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.08;
      }

      .intro {
        max-width: 760px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .diagram {
        margin-top: 24px;
        overflow-x: auto;
      }

      svg {
        display: block;
        width: 100%;
        min-width: 960px;
      }

      .colophon {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
        color: var(--soft);
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>

      <p class="eyebrow">Release Pulpe · Swimlane</p>
      <h1>Une seule release, deux PR de contrôle</h1>
      <p class="intro">
        La branche <strong>release/vX.Y.Z</strong> est préparée une seule fois.
        La première PR vérifie le candidat en staging ; la seconde autorise ce
        même contenu en production.
