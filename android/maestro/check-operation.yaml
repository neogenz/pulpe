# Journey 3 — point a forecast, then take it back.
#
# Pointing is the whole product: with no bank link, it is the only signal Pulpe
# has that a planned movement actually happened. A toggle that silently fails
# to persist is the worst bug this app can ship, so the flow points, undoes from the
# notice and checks the row is back rather than trusting the first repaint.
#
# Runs against a signed-in, unlocked device — chain it after `login-vault.yaml`.
# `LINE` defaults to a line the local seed always creates.
appId: app.pulpe.android
env:
  LINE: Loyer
---
- extendedWaitUntil:
    visible:
      id: "home-todo-to-point"
    timeout: 30000
- tapOn:
    id: "home-todo-to-point"

- scrollUntilVisible:
    element: "À pointer · ${LINE}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "À pointer · ${LINE}"

- extendedWaitUntil:
    visible: "${LINE} pointé"
    timeout: 30000
- tapOn: "Annuler"
- extendedWaitUntil:
    visible: "À pointer · ${LINE}"
    timeout: 30000

- back
- extendedWaitUntil:
    visible:
      id: "home-add-entry"
    timeout: 15000
