name: Android preview build

on:
  pull_request:
    branches: [preview, main]
    paths:
      - android/**
      - shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch: {}

jobs:
  build:
    name: Preview APK
    type: build
    params:
      platform: android
      profile: preview
