name: Android production

# `production` is the production pointer: only the release publish job advances
# it, so a push there is already a deliberate act, which is what makes it a safe
# release trigger. `main` is the trunk and must never build here. The submit
# lands on the internal track as a draft (see `eas.json`), so nothing reaches a
# user until it is promoted by hand in the Play Console.
on:
  push:
    branches: [production]
  workflow_dispatch: {}

jobs:
  build:
    name: Production AAB
    type: build
    params:
      platform: android
      profile: production

  submit:
    name: Play internal track
    type: submit
    needs: [build]
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      profile: production
